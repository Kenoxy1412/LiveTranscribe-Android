name: Deploy LiveCaptionN Translation Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker-translate/**"
      - ".github/workflows/deploy-translation-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker.js --name livecaptionn-translate --compatibility-date 2026-11-07
          workingDirectory: cloudflare-worker-translate
